name: Validate Zombie Mayhem

on:
  push:
    branches:
      - main
      - upgrade/zombie-mayhem-10
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate-game.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate game integrity
        run: npm run validate
